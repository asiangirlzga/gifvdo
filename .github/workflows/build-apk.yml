name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk gifvdo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gifvdo-apk
          path: gifvdo.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest gifvdo.apk \
            --title "Latest APK" \
            --notes "Debug-signed APK built from commit ${GITHUB_SHA::7}. Enable 'install unknown apps' to sideload." \
            --target "$GITHUB_SHA"
